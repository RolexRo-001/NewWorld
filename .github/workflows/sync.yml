name: Sincronizar Keiyoushi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sincronización
    runs-on: ubuntu-latest

    steps:
      - name: Obtener NewWorld
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "NewWorld Bot"
          git config user.email "41808202+github-actions[bot]@users.noreply.github.com"

      - name: Descargar repositorio de Keiyoushi
        run: |
          rm -rf /tmp/keiyoushi

          git clone \
            --depth 1 \
            --branch repo \
            https://github.com/keiyoushi/extensions.git \
            /tmp/keiyoushi

      - name: Preparar rama repo
        run: |
          rm -rf /tmp/newworld-repo
          mkdir -p /tmp/newworld-repo

          cp -a /tmp/keiyoushi/. /tmp/newworld-repo/

          rm -rf /tmp/newworld-repo/.git

      - name: Publicar rama repo
        run: |
          git fetch origin

          if git show-ref --verify --quiet refs/remotes/origin/repo; then
            git checkout repo
            git reset --hard origin/repo
          else
            git checkout --orphan repo
            git rm -rf . || true
          fi

          cp -a /tmp/newworld-repo/. .

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Sincronizar extensiones de Keiyoushi"
            git push origin repo
          fi

      - name: Mostrar resultado
        run: |
          echo "====================================="
          echo "     NEW WORLD - SINCRONIZADO"
          echo "====================================="
          echo "Repositorio: RolexRo-001/NewWorld"
          echo "Rama: repo"
          echo ""
          echo "Contenido:"
          ls -lah
