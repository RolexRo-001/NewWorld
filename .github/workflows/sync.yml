name: Sincronizar NewWorld

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:

  sincronizar:

    name: Sincronizar repositorio
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO COMPATIBLE
      # ==========================================

      - name: Descargar repositorio compatible
        run: |

          rm -rf /tmp/source
          rm -rf /tmp/newworld

          echo "Descargando repositorio..."

          git clone --depth 1 --branch repo \
            https://github.com/GeorgyDesign/mihon-extensions.git \
            /tmp/source

          echo "Repositorio descargado."

          echo "Contenido:"
          ls -la /tmp/source


      # ==========================================
      # 2. PREPARAR REPOSITORIO
      # ==========================================

      - name: Preparar repositorio
        run: |

          mkdir -p /tmp/newworld

          echo "Copiando archivos..."

          cp -a /tmp/source/. /tmp/newworld/

          cd /tmp/newworld

          # Eliminar información Git del repositorio original
          rm -rf .git

          echo ""
          echo "======================================"
          echo "   GENERANDO INDEX.MIN.JSON"
          echo "======================================"

          python3 - <<'PY'

          import json
          import os
          import sys

          print("Leyendo index.json...")

          # ------------------------------------------
          # LEER INDEX.JSON
          # ------------------------------------------

          with open("index.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          # ------------------------------------------
          # DETECTAR FORMATO
          # ------------------------------------------

          if isinstance(data, list):

              print("Formato detectado: lista")

              extensions = data

          elif isinstance(data, dict):

              print("Formato detectado: objeto")

              extension_list = data.get("extensionList")

              if isinstance(extension_list, dict):

                  extensions = extension_list.get("extensions", [])

              else:

                  extensions = []

          else:

              raise SystemExit(
                  "ERROR: index.json tiene un formato desconocido"
              )

          # ------------------------------------------
          # VALIDAR
          # ------------------------------------------

          if not isinstance(extensions, list):

              raise SystemExit(
                  "ERROR: la lista de extensiones no es válida"
              )

          print(
              "Extensiones encontradas:",
              len(extensions)
          )

          # ------------------------------------------
          # LIMPIAR ELEMENTOS INVÁLIDOS
          # ------------------------------------------

          resultado = []

          for ext in extensions:

              if isinstance(ext, dict):

                  resultado.append(ext)

          # ------------------------------------------
          # GENERAR INDEX.MIN.JSON
          # ------------------------------------------

          with open(
              "index.min.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          # ------------------------------------------
          # COMPROBAR ARCHIVO
          # ------------------------------------------

          tamaño = os.path.getsize(
              "index.min.json"
          )

          print("")
          print("======================================")
          print("      INDEX.MIN.JSON GENERADO")
          print("======================================")
          print(
              "Extensiones publicadas:",
              len(resultado)
          )
          print(
              "Tamaño:",
              tamaño,
              "bytes"
          )
          print("======================================")

          # ------------------------------------------
          # COMPROBAR QUE NO ESTÉ VACÍO
          # ------------------------------------------

          if len(resultado) == 0:

              raise SystemExit(
                  "ERROR: index.min.json quedó vacío"
              )

          print("")
          print("OK: index.min.json válido.")

          PY


      # ==========================================
      # 3. COMPROBAR ESTRUCTURA
      # ==========================================

      - name: Verificar repositorio
        run: |

          cd /tmp/newworld

          echo ""
          echo "======================================"
          echo "       VERIFICANDO REPOSITORIO"
          echo "======================================"

          echo ""
          echo "Archivos principales:"

          ls -lh \
            index.json \
            index.min.json \
            repo.json

          echo ""
          echo "Carpetas:"

          ls -ld \
            apk \
            icon

          echo ""
          echo "Cantidad de APK:"

          find apk \
            -type f \
            -name "*.apk" \
            | wc -l

          echo ""
          echo "Tamaño de index.min.json:"

          wc -c index.min.json

          echo ""
          echo "Primeros caracteres de index.min.json:"

          head -c 300 index.min.json

          echo ""
          echo ""
          echo "======================================"
          echo "       VERIFICACIÓN COMPLETADA"
          echo "======================================"


      # ==========================================
      # 4. PUBLICAR EN NEW WORLD
      # ==========================================

      - name: Publicar NewWorld
        run: |

          cd /tmp/newworld

          echo ""
          echo "======================================"
          echo "       PUBLICANDO NEWWORLD"
          echo "======================================"

          git init

          git checkout -b repo

          git config user.name "NewWorld Bot"

          git config user.email \
            "41808202+github-actions[bot]@users.noreply.github.com"

          git add -A

          git commit \
            -m "Actualizar repositorio NewWorld"

          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          git push \
            origin repo \
            --force

          echo ""
          echo "======================================"
          echo "       NEWWORLD PUBLICADO"
          echo "======================================"
