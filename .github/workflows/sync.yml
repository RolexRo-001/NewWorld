name: Sincronizar NewWorld

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar repositorio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio compatible
        run: |
          git clone \
            --depth 1 \
            --branch repo \
            https://github.com/GeorgyDesign/mihon-extensions.git \
            /tmp/newworld

      - name: Preparar repositorio
        run: |
          cd /tmp/newworld

          python3 - <<'PY'
          import json
          import os
          import re

          print("Preparando index.min.json...")

          with open("index.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          extension_list = data.get("extensionList", {})
          extensions = extension_list.get("extensions", [])

          if not isinstance(extensions, list):
              raise SystemExit("ERROR: extensionList.extensions no es una lista")

          resultado = []
          total = 0
          publicados = 0

          for ext in extensions:

              if not isinstance(ext, dict):
                  continue

              total += 1

              name = ext.get("name", "")
              package_name = ext.get("packageName", "")
              resources = ext.get("resources", {})

              if not isinstance(resources, dict):
                  continue

              apk_url = resources.get("apkUrl", "")

              if not apk_url:
                  continue

              apk_name = apk_url.split("/")[-1]

              apk_path = os.path.join("apk", apk_name)

              if not os.path.isfile(apk_path):
                  continue

              # Idioma principal
              language = "all"

              parts = package_name.split(".")

              if len(parts) >= 6:
                  language = parts[4]

              # NSFW
              warning = str(ext.get("contentWarning", ""))

              nsfw = 1 if "NSFW" in warning.upper() else 0

              # Código de versión
              try:
                  code = int(ext.get("versionCode", 0))
              except:
                  code = 0

              version = str(ext.get("versionName", ""))

              sources = []

              raw_sources = ext.get("sources", [])

              if isinstance(raw_sources, list):

                  for source in raw_sources:

                      if not isinstance(source, dict):
                          continue

                      source_item = {
                          "name": str(source.get("name", name)),
                          "lang": str(source.get("language", language)),
                          "id": str(source.get("id", "")),
                          "baseUrl": str(source.get("homeUrl", ""))
                      }

                      if source.get("mirrorUrls"):
                          source_item["mirrorUrls"] = source["mirrorUrls"]

                      sources.append(source_item)

              item = {
                  "name": name,
                  "pkg": package_name,
                  "apk": apk_name,
                  "lang": language,
                  "code": code,
                  "version": version,
                  "nsfw": nsfw,
                  "sources": sources
              }

              resultado.append(item)
              publicados += 1

          with open("index.min.json", "w", encoding="utf-8") as f:
              json.dump(
                  resultado,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("")
          print("======================================")
          print("      INDEX.MIN.JSON GENERADO")
          print("======================================")
          print("Extensiones encontradas:", total)
          print("Extensiones publicadas:", publicados)
          print("Tamaño:", os.path.getsize("index.min.json"), "bytes")
          print("======================================")

          if publicados == 0:
              raise SystemExit("ERROR: No se encontró ninguna extensión con APK")
          PY

          rm -rf .git

          git init
          git config user.name "NewWorld Bot"
          git config user.email "41808202+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Actualizar repositorio NewWorld"


      - name: Publicar NewWorld
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/newworld

          git branch -M repo

          git remote add origin \
            https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git push --force origin repo

      - name: Verificar
        run: |
          cd /tmp/newworld

          echo "======================================"
          echo "       NEWWORLD - VERIFICACIÓN"
          echo "======================================"

          echo ""
          echo "Archivos:"
          ls -lah

          echo ""
          echo "APK:"
          find apk -type f -name "*.apk" | wc -l

          echo ""
          echo "Index:"
          ls -lh index.min.json index.json repo.json

          echo ""
          echo "======================================"
          echo "       SINCRONIZACIÓN COMPLETA"
          echo "======================================"
