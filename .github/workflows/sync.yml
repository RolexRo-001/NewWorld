name: Sincronizar Keiyoushi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sincronización
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Keiyoushi
        run: |
          git clone --depth 1 --branch repo https://github.com/keiyoushi/extensions.git keiyoushi

      - name: Preparar repositorio
        run: |
          cd keiyoushi

          rm -rf .git

          git init
          git config user.name "NewWorld Bot"
          git config user.email "41808202+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Sincronizar extensiones de Keiyoushi"

      - name: Corregir repo.json
        run: |
          cd keiyoushi

          python3 - <<'PY'
          import json

          with open("repo.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          data["index_v2"] = "https://raw.githubusercontent.com/RolexRo-001/NewWorld/repo/index.pb"

          data["meta"]["name"] = "NewWorld"
          data["meta"]["website"] = "https://github.com/RolexRo-001/NewWorld"

          with open("repo.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

          git add repo.json
          git commit -m "Configurar repositorio NewWorld"

      - name: Publicar rama repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd keiyoushi

          git branch -M repo

          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git push --force origin repo

      - name: Verificar
        run: |
          cd keiyoushi

          echo "======================================"
          echo "       NEW WORLD - VERIFICACIÓN"
          echo "======================================"

          echo ""
          echo "index.json:"
          ls -lh index.json

          echo ""
          echo "index.pb:"
          ls -lh index.pb

          echo ""
          echo "index.min.json:"
          ls -lh index.min.json

          echo ""
          echo "repo.json:"
          cat repo.json

          echo ""
          echo "Extensiones en index.json:"
          grep -c '"name":' index.json || true

          echo ""
          echo "======================================"
          echo "       SINCRONIZACIÓN COMPLETA"
          echo "======================================"
