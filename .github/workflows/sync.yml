name: Sincronizar NewWorld

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sincronizar repositorio
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio compatible
        run: |
          git clone \
            --depth 1 \
            --branch repo \
            https://github.com/GeorgyDesign/mihon-extensions.git \
            /tmp/newworld

      - name: Preparar repositorio
        run: |
          cd /tmp/newworld

          rm -rf .git

          python3 - <<'PY'
          import json

          # Mantener el formato de índice compatible con
          # versiones antiguas de Aniyomi/Mihon.
          with open("repo.json", "r", encoding="utf-8") as f:
              repo = json.load(f)

          if "meta" in repo:
              repo["meta"]["name"] = "NewWorld"
              repo["meta"]["website"] = "https://github.com/RolexRo-001/NewWorld"

          with open("repo.json", "w", encoding="utf-8") as f:
              json.dump(repo, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY

          git init
          git config user.name "NewWorld Bot"
          git config user.email "41808202+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Actualizar repositorio NewWorld"

      - name: Publicar NewWorld
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/newworld

          git branch -M repo

          git remote add origin \
            https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git push --force origin repo

      - name: Verificar
        run: |
          cd /tmp/newworld

          echo "======================================"
          echo "       NEWWORLD - VERIFICACIÓN"
          echo "======================================"

          echo ""
          echo "Archivos:"
          ls -lah

          echo ""
          echo "APK:"
          find apk -type f -name "*.apk" | wc -l

          echo ""
          echo "Index:"
          ls -lh index.min.json index.json repo.json

          echo ""
          echo "======================================"
          echo "       SINCRONIZACIÓN COMPLETA"
          echo "======================================"
