name: Sincronizar Keiyoushi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sincronización
    runs-on: ubuntu-latest

    steps:
      - name: Obtener NewWorld
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config user.name "NewWorld Bot"
          git config user.email "41808202+github-actions[bot]@users.noreply.github.com"

      - name: Descargar repositorio de Keiyoushi
        run: |
          rm -rf /tmp/keiyoushi

          git clone \
            --depth 1 \
            --branch repo \
            https://github.com/keiyoushi/extensions.git \
            /tmp/keiyoushi

      - name: Preparar contenido
        run: |
          rm -rf /tmp/newworld-repo
          mkdir -p /tmp/newworld-repo

          cp -a /tmp/keiyoushi/. /tmp/newworld-repo/

          rm -rf /tmp/newworld-repo/.git

          echo "Contenido descargado:"
          find /tmp/newworld-repo -maxdepth 2 -type f | head -100

      - name: Publicar rama repo
        run: |
          git fetch origin

          if git ls-remote --exit-code --heads origin repo >/dev/null 2>&1; then
            git checkout repo
            git reset --hard origin/repo
          else
            git checkout --orphan repo
            git rm -rf . || true
          fi

          cp -a /tmp/newworld-repo/. .

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Sincronizar extensiones de Keiyoushi"
            git push origin repo
          fi

      - name: Verificar repositorio
        run: |
          echo "====================================="
          echo "       NEW WORLD - VERIFICACIÓN"
          echo "====================================="

          echo ""
          echo "Rama actual:"
          git branch --show-current

          echo ""
          echo "Archivos principales:"
          ls -lah index.min.json repo.json 2>/dev/null || true

          echo ""
          echo "Cantidad de APK:"
          find . -type f -name "*.apk" | wc -l

          echo ""
          echo "Cantidad de iconos:"
          find . -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.webp" \) | wc -l

          echo ""
          echo "Primeras extensiones:"
          find . -type f -name "*.apk" | head -20

          echo ""
          echo "====================================="
          echo "       SINCRONIZACIÓN COMPLETA"
          echo "====================================="
