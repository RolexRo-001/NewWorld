name: Sincronizar Keiyoushi

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sincronización
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Keiyoushi
        run: |
          git clone --depth 1 --branch repo https://github.com/keiyoushi/extensions.git keiyoushi

      - name: Preparar rama repo
        run: |
          cd keiyoushi
          rm -rf .git

          git init
          git config user.name "NewWorld Bot"
          git config user.email "41808202+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Sincronizar extensiones de Keiyoushi"

      - name: Publicar NewWorld
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd keiyoushi

          git branch -M repo

          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git

          git push --force origin repo

      - name: Verificar
        run: |
          cd keiyoushi

          echo "======================================"
          echo "       NEW WORLD - VERIFICACIÓN"
          echo "======================================"

          echo ""
          echo "Archivos:"
          ls -lah

          echo ""
          echo "APK encontrados:"
          find apk -type f -name "*.apk" | wc -l

          echo ""
          echo "Ejemplos:"
          find apk -type f -name "*.apk" | head -20

          echo ""
          echo "Índice:"
          ls -lh index.json index.min.json index.pb repo.json

          echo ""
          echo "======================================"
          echo "       SINCRONIZACIÓN COMPLETA"
          echo "======================================"
